<svg xmlns="http://www.w3.org/2000/svg" width="860" height="234" viewBox="0 0 860 234" role="img" aria-label="Kyrylo Bichkovskyi — Finance · Quant research · AI tools for markets">
  <defs>
    <linearGradient id="bar" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#58a6ff"/>
      <stop offset="1" stop-color="#a371f7"/>
    </linearGradient>
  </defs>
  <style>
    .sans { font-family: -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif; }
    .mono { font-family: ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace; }
    .f { opacity: 0; animation: rise .6s cubic-bezier(.2,.7,.2,1) forwards; }
    .grow { transform-box: fill-box; transform-origin: left center; transform: scaleX(0);
             animation: grow 1.4s cubic-bezier(.65,0,.35,1) .6s forwards; }
    .out { animation: fadeout .3s ease 2s forwards; }
    .pulse { animation: pulse 2.4s ease-in-out 2.6s infinite; }
    @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    @keyframes grow { to { transform: scaleX(1); } }
    @keyframes fadeout { to { opacity: 0; } }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
    @media (prefers-reduced-motion: reduce) {
      .f, .grow, .out, .pulse { animation: none; opacity: 1; transform: none; }
      .out { opacity: 0; }
    }
  </style>

  <rect x="1" y="1" width="858" height="232" rx="14" fill="#0d1117" stroke="#30363d"/>

  <g class="f">
    <circle cx="24" cy="22" r="5.5" fill="#ff5f57"/>
    <circle cx="42" cy="22" r="5.5" fill="#febc2e"/>
    <circle cx="60" cy="22" r="5.5" fill="#28c840"/>
    <text x="82" y="26" class="mono" font-size="12" fill="#8d96a0">~/AkirraBskyi</text>
    <circle class="pulse" cx="752" cy="22" r="4" fill="#3fb950"/>
    <text x="764" y="26" class="mono" font-size="12" fill="#8d96a0">Wrocław · PL</text>
    <line x1="1" y1="41" x2="859" y2="41" stroke="#30363d"/>
  </g>

  <g class="f" style="animation-delay:.15s">
    <text x="28" y="88" class="sans" font-size="32" font-weight="700" fill="#e6edf3">Kyrylo Bichkovskyi</text>
  </g>
  <g class="f" style="animation-delay:.3s">
    <text x="28" y="115" class="mono" font-size="14" fill="#58a6ff">finance · quant research · AI tools for markets</text>
  </g>
  <g class="f" style="animation-delay:.45s">
    <text x="28" y="138" class="sans" font-size="13" fill="#8d96a0">BBA Finance @ University of Wrocław</text>
  </g>

  <g class="f" style="animation-delay:.55s">
    <rect x="28" y="154" width="804" height="4" rx="2" fill="#21262d"/>
  </g>
  <rect class="grow" x="28" y="154" width="804" height="4" rx="2" fill="url(#bar)"/>
  <g class="f" style="animation-delay:.6s"><g class="out">
    <text x="832" y="138" text-anchor="end" class="mono" font-size="11" fill="#8d96a0">loading profile…</text>
  </g></g>
  <g class="f" style="animation-delay:2.05s">
    <text x="832" y="138" text-anchor="end" class="mono" font-size="11" fill="#3fb950">ready ✓</text>
  </g>

  <g class="f" style="animation-delay:2.05s">
    <rect x="28" y="172" width="256" height="46" rx="10" fill="#161b22" stroke="#30363d"/>
    <rect x="28" y="184" width="3" height="22" rx="1.5" fill="#58a6ff"/>
    <text x="44" y="191" class="sans" font-size="13" font-weight="600" fill="#e6edf3">Valuation &amp; modelling</text>
    <text x="44" y="208" class="mono" font-size="11" fill="#8d96a0">DCF · 3-statement · WACC</text>
  </g>
  <g class="f" style="animation-delay:2.20s">
    <rect x="302" y="172" width="256" height="46" rx="10" fill="#161b22" stroke="#30363d"/>
    <rect x="302" y="184" width="3" height="22" rx="1.5" fill="#3fb950"/>
    <text x="318" y="191" class="sans" font-size="13" font-weight="600" fill="#e6edf3">Quant research</text>
    <text x="318" y="208" class="mono" font-size="11" fill="#8d96a0">backtests · VaR · Black-Litterman</text>
  </g>
  <g class="f" style="animation-delay:2.35s">
    <rect x="576" y="172" width="256" height="46" rx="10" fill="#161b22" stroke="#30363d"/>
    <rect x="576" y="184" width="3" height="22" rx="1.5" fill="#a371f7"/>
    <text x="592" y="191" class="sans" font-size="13" font-weight="600" fill="#e6edf3">AI for markets</text>
    <text x="592" y="208" class="mono" font-size="11" fill="#8d96a0">Claude skills &amp; agents</text>
  </g>
</svg>
