<svg xmlns="http://www.w3.org/2000/svg" width="860" height="196" viewBox="0 0 860 196" role="img" aria-label="Kyrylo Bichkovskyi — finance · quant research · AI tools for markets">
  <defs>
    <linearGradient id="bn" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#0a1a33"/>
      <stop offset=".6" stop-color="#1a7f37"/>
      <stop offset="1" stop-color="#0969da"/>
    </linearGradient>
    <radialGradient id="gl">
      <stop offset="0" stop-color="#fff" stop-opacity=".22"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="cb"><rect x="1" y="1" width="858" height="194" rx="14"/></clipPath>
  </defs>
  <style>
    .s { font-family: -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif; }
    .m { font-family: ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace; }
    .soft { opacity: 0; animation: soft 1.1s cubic-bezier(.2,.7,.2,1) forwards; }
    .wv { animation-name: wv; animation-timing-function: linear; animation-iteration-count: infinite; }
    .rv { animation-direction: reverse; }
    .glow { animation: glow 9s ease-in-out infinite alternate; }
    @keyframes soft { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
    @keyframes wv { from { transform: translateX(0); } to { transform: translateX(-430px); } }
    @keyframes glow { from { transform: translateX(-240px); } to { transform: translateX(240px); } }
    @media (prefers-reduced-motion: reduce) {
      .soft { animation: none; opacity: 1; transform: none; }
      .wv, .glow { animation: none; }
    }
  </style>

  <g clip-path="url(#cb)">
    <rect width="860" height="196" fill="url(#bn)"/>
    <circle class="glow" cx="430" cy="40" r="280" fill="url(#gl)"/>
    <path class="wv rv" style="animation-duration:16s" d="M0 152 q107.5 -9 215 0 t215 0 t215 0 t215 0 t215 0 t215 0 t215 0 t215 0 V196 H0 Z" fill="#0d1117" opacity="0.35"/>
    <path class="wv" style="animation-duration:11s" d="M0 164 q107.5 -11 215 0 t215 0 t215 0 t215 0 t215 0 t215 0 t215 0 t215 0 V196 H0 Z" fill="#0d1117" opacity="1"/>
  </g>

  <g class="soft" style="animation-delay:.1s">
    <text x="430" y="76" text-anchor="middle" class="s" font-size="40" font-weight="700" fill="#fff">Kyrylo Bichkovskyi</text>
  </g>
  <g class="soft" style="animation-delay:.3s">
    <text x="430" y="104" text-anchor="middle" class="m" font-size="15" fill="#fff" fill-opacity=".92">finance · quant research · AI tools for markets</text>
  </g>
  <g class="soft" style="animation-delay:.45s">
    <text x="430" y="126" text-anchor="middle" class="s" font-size="13" fill="#fff" fill-opacity=".75">BBA Finance @ University of Wrocław · Wrocław · PL</text>
  </g>
</svg>
