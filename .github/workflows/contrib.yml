name: Update contributions graph

on:
  schedule:
    - cron: "17 */6 * * *"   # every 6 hours (GitHub sometimes skips a scheduled run)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  graph:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build graph
        run: python assets/make_contrib.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/contrib-*.svg
          git diff --cached --quiet || (git commit -m "Update contributions graph" && git push)
